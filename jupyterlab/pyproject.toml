[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-gmacs-syntax"
version = "0.1.3"
description = "Highlights %%gmacs cells in JupyterLab and Jupyter Notebook as gmacs"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
]

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_gmacs_syntax"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_gmacs_syntax/labextension" = "share/jupyter/labextensions/jupyterlab-gmacs-syntax"
"install.json" = "share/jupyter/labextensions/jupyterlab-gmacs-syntax/install.json"
